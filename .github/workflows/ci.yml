name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Preserve running main deployments and migrations; supersede old PR checks.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/checks.yml

  smoke-tests:
    name: Smoke tests
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend and isolated Docker smoke tests
        run: make smoke-tests

  cd:
    name: CD
    needs: [ci, smoke-tests]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_AUTOMATIC != 'false'
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/cd.yml
    with:
      sha: ${{ github.sha }}
      ci_run_id: ${{ format('{0}', github.run_id) }}
    secrets:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_KEY: ${{ secrets.SERVER_KEY }}
