name: Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Preserve running main deployments and migrations; supersede old PR checks.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEPLOY_BRANCH: main

jobs:
  ci-back:
    name: CI (Back)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: development
      DEBUG: 'false'
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dungeon_master
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dungeon_master_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dungeon_master
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dungeon_master"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          make -C backend install
      - name: Backend verification
        run: make ci-backend

  ci-front:
    name: CI (Front)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend checks and unit tests
        run: make ci-frontend-checks

  smoke-tests:
    name: Smoke tests
    needs: [ci-back, ci-front]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend and isolated Docker smoke tests
        run: make smoke-tests

  verify:
    name: Verify release
    needs: [ci-back, ci-front, smoke-tests]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (vars.DEPLOY_AUTOMATIC != 'false' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify trusted branch and exact CI commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEPLOY_BRANCH" ]]; then
            echo 'Run manual CD from the configured deployment branch.' >&2
            exit 1
          fi
          python3 scripts/check_release_ci.py

  build:
    name: Build release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build matching backend and frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: make release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-release
          path: build/release.tar.gz
          if-no-files-found: error
          retention-days: 14

  cd:
    name: CD
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_KEY: ${{ secrets.SERVER_KEY }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
      DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/srv/dungeon-master' }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vps-release
          path: build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install isolated browser smoke tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dungeon-browser" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/dungeon-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Deploy, verify and record release
        env:
          NODE_PATH: ${{ runner.temp }}/dungeon-browser/node_modules
        run: make deploy
