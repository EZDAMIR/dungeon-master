name: CD

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA with successful CI on the deployment branch
        required: true
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Never cancel an in-flight backup or migration.
concurrency:
  group: dungeon-master-vps
  cancel-in-progress: false

env:
  DEPLOY_BRANCH: main

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_AUTOMATIC != 'false' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify trusted branch and exact CI commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEPLOY_BRANCH" ]]; then
            echo 'Run manual CD from the configured deployment branch.' >&2
            exit 1
          fi
          python3 scripts/check_release_ci.py

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build matching backend and frontend release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: make release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vps-release
          path: build/release.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_KEY: ${{ secrets.SERVER_KEY }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      SERVER_KNOWN_HOSTS: ${{ vars.SERVER_KNOWN_HOSTS }}
      DEPLOY_ORIGIN: ${{ vars.DEPLOY_ORIGIN }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/srv/dungeon-master' }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vps-release
          path: build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install isolated browser smoke tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dungeon-browser" --no-save --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/dungeon-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Deploy, verify and record release
        env:
          NODE_PATH: ${{ runner.temp }}/dungeon-browser/node_modules
        run: make deploy
