# Used only by make ci-docker, with a unique project name and owned volume.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dungeon_ci
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dungeon_ci']
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      DEBUG: 'false'
      SECRET_KEY: ci-only-signing-key-not-for-deployment
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/dungeon_ci
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8000/api/v1/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
